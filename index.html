<title>Leader Gym Ресепшн</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Ресепшн-приложение: один столбец под большой палец, липкая шапка с поиском, нижняя панель. Чёрный зал и жёлтая разметка, как на логотипе. Намеренно одна тёмная тема. */
:root{
  --bg:#0b0b0a; --surface:#161612; --surface-2:#211f18; --line:#302d22;
  --fg:#f6f3e8; --muted:#9d988a;
  --accent:#ffe100; --accent-ink:#0b0b0a;
  --ok:#41d27a; --warn:#ff9d1c; --bad:#ff5252; --ice:#6cc8ff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 140px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;display:grid;gap:14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.01em;line-height:1}
.brand b{color:var(--accent);font-weight:800}
.date{color:var(--muted);font-size:14px;text-align:right}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.stat strong{font-family:var(--display);font-weight:800;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.stat span{color:var(--muted);font-size:13px;line-height:1.2}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;box-sizing:border-box;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:18px;padding:0 44px 0 48px}
.search input::placeholder{color:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;color:var(--muted);font-size:22px}

/* список */
.list{display:grid;gap:10px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.card-main{text-align:left;display:grid;gap:5px;min-width:0;padding:2px 0}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.pill.frz{color:var(--ice);background:color-mix(in srgb,var(--ice) 15%,transparent)}
.pill.debt{color:var(--fg);background:var(--surface-2);border:1px dashed var(--muted)}
.come{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:14px;height:52px;padding:0 18px;border-radius:12px;transition:transform .08s}
.come:active{transform:scale(.96)}
.done{color:var(--ok);font-size:13px;font-weight:600;text-align:center;line-height:1.25;padding:0 6px}
.done big{display:block;font-size:20px}
.confirm{grid-column:1/-1;background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:14px}
.confirm p{margin:0;flex:1 1 180px;color:var(--fg)}
.confirm p b{color:var(--bad)}
.btn{height:42px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px}
.btn.y{background:var(--accent);color:var(--accent-ink)}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.r{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:32px 8px;display:grid;gap:14px;justify-items:center}
.note{color:var(--muted);font-size:13px;margin-top:24px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px}
.note button{color:var(--accent);text-decoration:underline;padding:0}

/* внимание */
.sec{margin-top:18px}
.sec h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h2 .n{color:var(--fg)}
.row{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.row .l{min-width:0;display:grid;gap:3px}
.row .r{font-size:13px;font-weight:600;text-align:right;flex:none;font-variant-numeric:tabular-nums}

/* нижняя панель */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none;padding:28px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 55%,transparent)}
.nav-in{max-width:480px;margin:0 auto;display:flex;align-items:stretch;gap:10px}
.tabs{pointer-events:auto;flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04)}
.fab{pointer-events:auto;flex:none;width:76px;border-radius:26px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 28%,transparent),0 12px 32px rgba(0,0,0,.5);transition:transform .12s,filter .2s}
.fab svg{width:28px;height:28px}
.fab:hover{filter:brightness(1.06)}
.fab:active{transform:scale(.93)}
.tab{display:grid;justify-items:center;gap:4px;padding:6px 0 5px;font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--muted);border-radius:20px;transition:color .2s}
.tab .pic{position:relative;width:54px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s,color .2s,transform .12s}
.tab svg{width:22px;height:22px}
.tab:hover .pic{background:var(--surface-2)}
.tab:active .pic{transform:scale(.92)}
.tab.on{color:var(--fg);font-weight:600}
.tab.on .pic{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.badge{position:absolute;top:-5px;right:2px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;min-width:18px;height:18px;line-height:15px;padding:0 4px;box-sizing:border-box;border:1.5px solid var(--surface);text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tab .pic,.fab{transition:none}}

/* шторка */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;box-sizing:border-box;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.come{transition:none}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.x{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:22px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;background:var(--bg);border-radius:14px;padding:14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.f{display:grid;gap:8px}
.f label,.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:17px;padding:0 14px;width:100%;box-sizing:border-box;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:10px 14px;font-size:15px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{height:44px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--fg)}
.seg button.on.debt{color:var(--warn)}
.big{height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:15px;width:100%}
.err{color:var(--bad);font-size:14px;margin:0}
.hist{display:grid;gap:0;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist div span:first-child{color:var(--muted)}
.hist .pay span:last-child{color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts .btn{flex:1 1 140px;height:50px}
.box{background:var(--bg);border-radius:14px;padding:14px;display:grid;gap:14px}

/* доход */
.st-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:14px}
.per{display:flex;align-items:center;gap:6px}
.per button{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;line-height:1}
.per button:disabled{opacity:.3;cursor:default}
.per b{font-family:var(--display);font-weight:600;font-size:16px;min-width:8.6em;text-align:center}
.seg.mini{width:190px;flex:none}
.seg.mini button{height:36px;font-size:14px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;margin-top:12px}
.hero .num{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,42px);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.hero .num small{font-size:.42em;color:var(--muted);font-weight:600}
.delta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.delta b{color:var(--fg)}
.delta b.up{color:var(--ok)} .delta b.down{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.kpi strong{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{color:var(--muted);font-size:13px}
.kpi.debt strong{color:var(--warn)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;margin-top:10px}
.ch-read{min-height:20px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch-read b{color:var(--fg)}
.chart{position:relative;height:150px;margin-top:22px;border-bottom:1px solid var(--muted)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.gl i{position:absolute;right:0;bottom:2px;font-style:normal;font-size:11px;color:var(--muted);background:var(--surface);padding-left:4px;font-variant-numeric:tabular-nums}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;padding:0;min-width:0;border-radius:4px 4px 0 0}
.bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;transition:background .1s}
.bar:hover i,.bar.on i{background:var(--fg)}
.bar:hover,.bar.on{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.xlab{position:relative;height:16px;margin-top:6px;font-size:11px;color:var(--muted)}
.xlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.brk{display:grid;gap:6px;margin-bottom:12px}
.brk-top{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-variant-numeric:tabular-nums}
.brk-top span:last-child{color:var(--muted)} .brk-top b{color:var(--fg)}
.track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.xl{width:100%;height:56px;border-radius:14px;border:1px solid var(--accent);color:var(--accent);font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px}
.xl svg{width:22px;height:22px}
.xl:disabled{opacity:.5}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:8px 0 0}

/* шапка: тарифы */
.hdr-r{display:flex;align-items:center;gap:10px;min-width:0}
.gear{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;flex:none}
.gear svg{width:18px;height:18px;color:var(--accent)}
.ph-r{display:flex;gap:8px;flex:none}
.edit{height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px}
.seg button:disabled{opacity:.45;cursor:default}
.seg.three{grid-template-columns:repeat(3,1fr)}
.days{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.days input{width:90px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;padding:0 12px;box-sizing:border-box}
.frzinfo{color:var(--ice);font-size:14px;margin:0}
.hist .frzrow span:last-child{color:var(--ice)}
.row.off{opacity:.55}
.sub-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 0}
.inline{display:flex;gap:10px;align-items:flex-end}
.inline .f{flex:1;min-width:0}
.inline .seg{flex:none;width:150px}

@media (max-width:380px){.hdr-r .date{display:none}}
/* сохранение */
.savechip{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;flex:none;white-space:nowrap}
.savechip i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.savechip.ok i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.savechip.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))} .savechip.warn i{background:var(--warn)}
.savechip.bad{border-color:var(--bad)} .savechip.bad i{background:var(--bad)}
@media (max-width:520px){.hdr-r .date{display:none}}
@media (max-width:420px){.gear span,.savechip span{display:none}.gear,.savechip{width:40px;padding:0;justify-content:center}}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:14px;margin:4px 0 12px;font-size:14px;line-height:1.4;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line))}
.banner p{margin:0;flex:1 1 200px}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.dsec{background:var(--bg);border-radius:16px;padding:16px;display:grid;gap:12px}
.dsec h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.dsec p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.dsec p b{color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.dsec .acts .btn{flex:1 1 150px}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.6}
.steps b{color:var(--fg)}

/* тост */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast button{background:var(--bg);color:var(--accent);height:40px;padding:0 14px;border-radius:10px;font-weight:600;flex:none}
.toast span{min-width:0;overflow-wrap:anywhere}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <div class="brand"><b>LEADER</b>GYM</div>
      <div class="hdr-r"><div class="date" id="today"></div>
        <button class="savechip" id="saveChip" data-datasheet aria-label="Сохранение данных"><i></i><span>Данные</span></button>
        <button class="gear" data-plans aria-label="Тарифы и цены"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Тарифы</span></button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><strong id="stToday">0</strong><span>пришли<br>сегодня</span></div>
      <div class="stat"><strong id="stActive">0</strong><span>активных<br>абонементов</span></div>
    </div>
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Имя или телефон" autocomplete="off" aria-label="Поиск клиента">
      <button class="clear" id="qClear" hidden aria-label="Очистить поиск">×</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav">
  <div class="nav-in">
   <div class="tabs">
    <button class="tab on" data-tab="clients">
      <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.7"/></svg></span>
      Клиенты
    </button>
    <button class="tab" data-tab="alerts">
      <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg><span class="badge" id="badge" hidden></span></span>
      Внимание
    </button>
    <button class="tab" data-tab="stats">
      <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
      Доход
    </button>
  </div>
    <button class="fab" data-new="" aria-label="Добавить клиента"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</nav>

<div id="sheet"></div>
<div id="toastBox"></div>

<script>
(function(){
const DEFAULT_PLANS=[
  {id:'m1',label:'1 месяц',type:'period',months:1,price:250},
  {id:'m3',label:'3 месяца',type:'period',months:3,price:650},
  {id:'m6',label:'6 месяцев',type:'period',months:6,price:1200},
  {id:'v12',label:'12 занятий',type:'visits',count:12,price:200},
  {id:'v1',label:'Разовое',type:'visits',count:1,price:25}
];
const plan=id=>((db&&db.plans)||[]).find(p=>p.id===id)||DEFAULT_PLANS.find(p=>p.id===id)||{id,label:'Тариф',type:'period',months:1,price:0};
const activePlans=()=>((db&&db.plans)||DEFAULT_PLANS).filter(p=>!p.archived);
const pickPlan=sel=>{const a=activePlans();return (a.find(p=>p.id===sel)||a[0]||DEFAULT_PLANS[0]).id};
const planLen=p=>p.type==='visits'?p.count+' '+plural(p.count,['занятие','занятия','занятий']):p.days?p.days+' '+plural(p.days,['день','дня','дней']):p.months+' '+plural(p.months,['месяц','месяца','месяцев']);
const copyPlans=()=>JSON.parse(JSON.stringify(DEFAULT_PLANS));

const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const z=n=>String(n).padStart(2,'0');
function plural(n,f){const a=n%10,b=n%100;return f[(a===1&&b!==11)?0:(a>=2&&a<=4&&(b<12||b>14))?1:2]}
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parse=s=>{const[y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const nowStamp=()=>{const d=new Date();return iso(d)+'T'+z(d.getHours())+':'+z(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е').trim();
const money=n=>Number(n).toLocaleString('ru-RU')+' смн';
const phoneFmt=p=>{const d=String(p).replace(/\D/g,'').replace(/^992/,'');return d.length===9?`+992 ${d.slice(0,2)} ${d.slice(2,5)} ${d.slice(5,7)} ${d.slice(7)}`:(p||'—')};
const last4=p=>{const d=String(p).replace(/\D/g,'');return d?'•• '+d.slice(-4):'без телефона'};

/* ---------- данные ---------- */
const KEY='leadergym-demo-v1';
let db=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)db=JSON.parse(r)}catch(e){} if(!db||!Array.isArray(db.clients))db=seed();if(!Array.isArray(db.plans))db.plans=copyPlans();}
function save(){db.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if(typeof scheduleWrite==='function')scheduleWrite()}
function saveLocalOnly(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
let uid=Date.now();
const newId=()=>'c'+(uid++).toString(36);

function makeSub(planId,start,usedBefore){
  const p=plan(planId);
  return p.type==='period'
    ?{planId,start,end:p.days?addDays(start,p.days-1):addDays(addMonths(start,p.months),-1)}

      for(let i=0;i<used;i++){const d=addDays(start,i*step);if(diff(d,TODAY)<0)visits.push(d+'T'+z(8+(i*3)%11)+':'+z((i*17)%60));}

      for(let d=start,i=0;diff(d,endLimit)<=0;d=addDays(d,2+(i%2)),i++)visits.push(d+'T'+z(7+(i*5)%13)+':'+z((i*23)%60));

  });

  [['Умед Рашидов',-260,'m3'],['Ситора Назарова',-190,'m1'],['Абдулло Шоев',-120,'m1'],['Мехрона Алиева',-75,'v12']].forEach(([name,off,pid],i)=>{

function status(c){
  const p=plan(c.sub.planId);
  if(p.type==='period'){
    const fr=frozenNow(c);
    if(fr)return{cls:'frz',text:'Заморожен до '+fmt(fr.to)};
    const d=diff(c.sub.end,TODAY);
    if(diff(c.sub.start,TODAY)>0)return{cls:'ok',text:'с '+fmt(c.sub.start)};
    if(d<0)return{cls:'bad',text:'Истёк '+fmt(c.sub.end)};
    if(d===0)return{cls:'warn',text:'Последний день'};
    if(d<=5)return{cls:'warn',text:'Осталось '+d+' дн. · до '+fmt(c.sub.end)};
    return{cls:'ok',text:'до '+fmt(c.sub.end)};
  }
  const left=c.sub.total-c.sub.used;
  if(left<=0)return{cls:'bad',text:'Занятия закончились'};
  if(left<=2)return{cls:'warn',text:'Осталось '+left+' зан.'};
  return{cls:'ok',text:left+' из '+c.sub.total+' зан.'};
}

function loadXLSX(){

const xSerial=v=>{const[y,m,d]=v.slice(0,10).split('-').map(Number);let n=(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5;if(v.length>=16){const[h,mi]=v.slice(11,16).split(':').map(Number);n+=(h*60+mi)/1440}return n};
const xD=v=>v?{t:'n',v:xSerial(v),z:'dd.mm.yyyy'}:null;
const xDT=v=>v?{t:'n',v:xSerial(v),z:'dd.mm.yyyy hh:mm'}:null;
const xM=n=>({t:'n',v:Number(n)||0,z:'#,##0'});
function makeSheet(XLSX,rows,widths,filterFrom){
  const ws={};let maxC=0;
  rows.forEach((row,R)=>{row.forEach((v,C)=>{if(v===null||v===undefined||v==='')return;
    ws[XLSX.utils.encode_cell({r:R,c:C})]=typeof v==='object'?v:typeof v==='number'?{t:'n',v}:{t:'s',v:String(v)};maxC=Math.max(maxC,C)})});
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length-1,0),c:maxC}});
  ws['!cols']=widths.map(w=>({wch:w}));
  if(filterFrom!==undefined&&rows.length>filterFrom+1)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:filterFrom,c:0},e:{r:rows.length-1,c:maxC}})};
  return ws;
}

async function exportExcel(btn){
  if(btn)btn.disabled=true;

    const XLSX=await loadXLSX();

    /* сводка по месяцам */
    const keys=new Set();L.forEach(p=>keys.add(p.date.slice(0,7)));

    });
    const a=5,b=sum.length,total=L.reduce((x,p)=>x+p.amount,0);
    sum.push(['Итого',{t:'n',v:total,f:`SUM(B${a}:B${b})`,z:'#,##0'},{t:'n',v:L.length,f:`SUM(C${a}:C${b})`}]);
    sum.push([],['Долги клиентов сейчас, смн',xM(live().reduce((x,c)=>x+(Number(c.debt)||0),0))],['Активных абонементов',live().filter(c=>status(c).cls!=='bad').length]);

    XLSX.utils.book_append_sheet(wb,makeSheet(XLSX,pay,[12,26,18,14,12],0),'Оплаты');

    const cl=[['Имя','Телефон','Абонемент','Начало','Окончание','Занятий осталось','Статус','Долг, смн','Посещений','Последний визит','Оплачено всего, смн','Клиент с']]
      .concat(live().slice().sort((x,y)=>x.name.localeCompare(y.name,'ru')).map(c=>{const p=plan(c.sub.planId),lv=c.visits.slice().sort().pop();
        return[c.name,c.phone?phoneFmt(c.phone):'',p.label,xD(c.sub.start),p.type==='period'?xD(c.sub.end):null,p.type==='visits'?Math.max(0,c.sub.total-c.sub.used):null,
          statusWord(c),c.debt?xM(c.debt):null,c.visits.length,lv?xDT(lv):null,xM(c.payments.reduce((x,q)=>x+(Number(q.amount)||0),0)),xD(createdOf(c))]}));
    XLSX.utils.book_append_sheet(wb,makeSheet(XLSX,cl,[26,18,13,12,12,10,18,10,10,17,14,12],0),'Клиенты');
    /* посещения */

    const vi=[['Дата и время','Клиент','Абонемент']].concat(vs.map(([v,c])=>[xDT(v),c.name+(c.deleted?' (удалён)':''),plan(c.sub.planId).label]));
    XLSX.utils.book_append_sheet(wb,makeSheet(XLSX,vi,[17,26,14],0),'Посещения');

  }catch(e){toast('Не удалось создать файл. Откройте приложение с интернетом один раз и попробуйте снова')}
  finally{if(btn)btn.disabled=false}
}

/* ---------- заморозка ---------- */
function unfreeze(c){
  const f=frozenNow(c)||freezeAhead(c);if(!f)return;
  if(f.from>TODAY){c.sub.end=addDays(c.sub.end,-f.days);c.freezes=c.freezes.filter(x=>x!==f);return}
  const left=diff(f.to,TODAY)+1;               /* сегодня клиент уже пришёл — эти дни возвращаем */
  c.sub.end=addDays(c.sub.end,-left);
  f.to=addDays(TODAY,-1);f.days=diff(f.to,f.from)+1;
  if(f.days<=0)c.freezes=c.freezes.filter(x=>x!==f);
}

/* ---------- отметка ---------- */
function mark(id,force){
  const c=byId(id);if(!c)return;
  const st=status(c).cls;
  if(!force&&(st==='bad'||st==='frz')){ui.pending=id;render();return}
  if(st==='frz')unfreeze(c);
  ui.pending=null;
  const stamp=nowStamp();
  c.visits.push(stamp);
  const counted=plan(c.sub.planId).type==='visits';
  if(counted)c.sub.used++;
  lastMark={id,stamp,counted};
  save();render();
  toast(`${c.name.split(' ')[0]} отмечен`,'Отменить',undo);
}
function undo(){
  if(!lastMark)return;const c=byId(lastMark.id);
  if(c){const i=c.visits.lastIndexOf(lastMark.stamp);if(i>-1)c.visits.splice(i,1);if(lastMark.counted)c.sub.used=Math.max(0,c.sub.used-1)}
  lastMark=null;save();render();hideToast();
}
function toast(text,btn,fn){

  box.innerHTML=`<div class="toast" role="status"><span>${esc(text)}</span>${btn?`<button id="toastBtn">${btn}</button>`:''}</div>`;
  if(btn)document.getElementById('toastBtn').onclick=fn;
  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,6000);
}
function hideToast(){document.getElementById('toastBox').innerHTML=''}


/* ---------- сохранение в файл на диске ---------- */
const fs={supported:typeof window.showSaveFilePicker==='function'&&typeof window.showOpenFilePicker==='function',handle:null,name:'',state:'off',lastWrite:0,timer:null};
const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('leadergym-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv',mode),st=t.objectStore('kv'),q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  get(k){return this.run('readonly',st=>st.get(k))},set(k,v){return this.run('readwrite',st=>st.put(v,k))},del(k){return this.run('readwrite',st=>st.delete(k))}
};
const FILE_TYPES=[{description:'Данные Leader Gym',accept:{'application/json':['.json']}}];
function scheduleWrite(){if(fs.state!=='on')return;clearTimeout(fs.timer);fs.timer=setTimeout(writeFile,300)}
async function writeFile(){
  if(!fs.handle)return;
  try{
    const w=await fs.handle.createWritable();await w.write(JSON.stringify(db));await w.close();
    fs.lastWrite=Date.now();fs.state='on';
  }catch(e){
    fs.state=e&&e.name==='NotAllowedError'?'needs':'error';
    toast(fs.state==='needs'?'Нужно разрешить запись в файл данных':'Не удалось записать файл данных. Проверьте, что флэшка или диск на месте');
  }
  renderSaveChip();if(ui.sheet&&ui.sheet.kind==='data')openData();
}
async function readHandle(h){const f=await h.getFile(),t=await f.text();if(!t.trim())return null;const d=JSON.parse(t);if(!d||!Array.isArray(d.clients))throw new Error('format');return d}
/* какие данные свежее: в браузере или в файле */
async function reconcile(){
  let fd=null;try{fd=await readHandle(fs.handle)}catch(e){toast('Файл данных повреждён. Записываю туда текущие данные');}
  let msg='';
  if(fd&&(db.demo||!live().length||(fd.savedAt||0)>(db.savedAt||0))){
    if(!Array.isArray(fd.plans))fd.plans=copyPlans();
    db=fd;saveLocalOnly();msg='Данные загружены из файла: '+live().length+' '+plural(live().length,['клиент','клиента','клиентов']);
  }
  fs.state='on';await writeFile();render();return msg;
}
async function attach(h){fs.handle=h;fs.name=h.name;try{await idb.set('handle',h)}catch(e){}}
async function fsCreate(){
  try{
    const h=await showSaveFilePicker({suggestedName:'LeaderGym-dannye.json',types:FILE_TYPES});
    await attach(h);fs.state='on';
    await writeFile();render();if(ui.sheet)openData();
    toast('Автосохранение включено: '+h.name);
  }catch(e){if(e&&e.name!=='AbortError')toast('Не получилось создать файл')}
}
async function fsOpen(){
  try{
    const [h]=await showOpenFilePicker({types:FILE_TYPES,multiple:false});
    if((await h.requestPermission({mode:'readwrite'}))!=='granted'){toast('Без разрешения на запись файл подключить нельзя');return}
    try{await readHandle(h)}catch(e){toast('Этот файл не похож на данные Leader Gym');return}
    await attach(h);const msg=await reconcile();if(ui.sheet)openData();
    toast(msg||('Файл подключён: '+h.name));
  }catch(e){if(e&&e.name!=='AbortError')toast('Не получилось открыть файл')}
}
async function fsReconnect(){
  if(!fs.handle)return;
  try{
    if((await fs.handle.requestPermission({mode:'readwrite'}))!=='granted'){toast('Без разрешения данные пишутся только в браузер');return}
    const msg=await reconcile();if(ui.sheet&&ui.sheet.kind==='data')openData();toast(msg||'Сохранение в файл продолжается');
  }catch(e){fs.state='error';renderSaveChip();toast('Файл не найден. Подключите его заново в разделе «Данные»')}
}
async function fsOff(){fs.handle=null;fs.name='';fs.state='off';try{await idb.del('handle')}catch(e){}render();openData();toast('Автосохранение в файл выключено')}
async function fsInit(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(!fs.supported){fs.state='unsupported';render();return}
  let h=null;try{h=await idb.get('handle')}catch(e){}
  if(!h){render();return}
  fs.handle=h;fs.name=h.name;
  let p='prompt';try{p=await h.queryPermission({mode:'readwrite'})}catch(e){}
  if(p==='granted'){try{await reconcile()}catch(e){fs.state='error';render()}}
  else{fs.state='needs';render()}
}
const daysSince=t=>t?Math.floor((Date.now()-t)/864e5):null;
const hhmm=t=>{const d=new Date(t);return z(d.getHours())+':'+z(d.getMinutes())};

  const n=Math.max(0,Math.round(Number(document.getElementById('fzN').value)||0));
  const from=document.getElementById('fzFrom').value||TODAY;
  el.textContent=n?`Заморозка до ${fmt(addDays(from,n-1))}. Абонемент продлится до ${fmt(addDays(c.sub.end,n))}.`:'';
}
function saveFreeze(){
  const c=byId(ui.sheet.id);if(!c)return;
  const n=Math.round(Number(document.getElementById('fzN').value)||0);
  let from=document.getElementById('fzFrom').value||TODAY;
  if(n<1||n>180){toast('Укажите от 1 до 180 дней');return}
  if(from<TODAY)from=TODAY;
  if(from>c.sub.end){toast('Дата заморозки позже окончания абонемента');return}
  c.freezes=c.freezes||[];
  c.freezes.push({from,to:addDays(from,n-1),days:n});
  c.sub.end=addDays(c.sub.end,n);
  save();render();openClient(c.id);toast(`Заморожено на ${n} ${plural(n,['день','дня','дней'])}`);
}

function openEdit(id){
  const c=byId(id);if(!c)return;
  ui.sheet={kind:'edit',id};
  const p=plan(c.sub.planId);
  const subF=p.type==='period'
    ?`<div class="two"><div class="f"><label for="eStart">Начало</label><input id="eStart" type="date" value="${c.sub.start}"></div><div class="f"><label for="eEnd">Окончание</label><input id="eEnd" type="date" value="${c.sub.end}"></div></div>`
    :`<div class="two"><div class="f"><label for="eTotal">Всего занятий</label><input id="eTotal" type="number" inputmode="numeric" min="1" value="${c.sub.total}"></div><div class="f"><label for="eUsed">Использовано</label><input id="eUsed" type="number" inputmode="numeric" min="0" value="${c.sub.used}"></div></div>`;
  showSheet(`<div class="ph"><h2>Изменить данные</h2><button class="x" data-open="${c.id}" aria-label="Назад">×</button></div>
  <div class="f"><label for="eName">Имя и фамилия</label><input id="eName" value="${esc(c.name)}" autocomplete="off"></div>
  <div class="f"><label for="ePhone">Телефон</label><input id="ePhone" type="tel" inputmode="tel" value="${esc(c.phone?phoneFmt(c.phone):'')}" placeholder="+992 90 000 00 00"></div>
  <p class="sub-h">Абонемент: ${esc(p.label)}</p>
  ${subF}
  <div class="f"><label for="eDebt">Долг, смн</label><input id="eDebt" type="number" inputmode="numeric" min="0" value="${c.debt||0}"></div>
  <p class="err" id="eErr" hidden></p>
  <button class="big" data-saveedit>Сохранить изменения</button>
  <button class="btn g" data-open="${c.id}">Отмена</button>`);
}
function saveEdit(){
  const c=byId(ui.sheet.id);if(!c)return;
  const err=document.getElementById('eErr'),fail=m=>{err.textContent=m;err.hidden=false};
  const name=document.getElementById('eName').value.trim().replace(/\s+/g,' ');
  const phone=document.getElementById('ePhone').value.replace(/\D/g,'').replace(/^992/,'');
  if(!name)return fail('Впишите имя клиента.');
  if(phone&&live().some(x=>x!==c&&x.phone===phone))return fail('Этот телефон уже записан у другого клиента.');
  const debt=Math.max(0,Number(document.getElementById('eDebt').value)||0);
  if(plan(c.sub.planId).type==='period'){
    const st=document.getElementById('eStart').value,en=document.getElementById('eEnd').value;
    if(!st||!en)return fail('Укажите даты начала и окончания.');
    if(en<st)return fail('Окончание не может быть раньше начала.');
    c.sub.start=st;c.sub.end=en;
  }else{
    const tot=Math.round(Number(document.getElementById('eTotal').value)||0),used=Math.round(Number(document.getElementById('eUsed').value)||0);
    if(tot<1)return fail('Всего занятий должно быть не меньше 1.');
    if(used<0||used>tot)return fail('Использовано не может быть больше, чем всего занятий.');
    c.sub.total=tot;c.sub.used=used;
  }
  c.name=name;c.phone=phone;c.debt=debt;
  save();render();openClient(c.id);toast('Изменения сохранены');
}

function openPlans(){
  ui.sheet={kind:'plans'};
  const counts={};live().forEach(c=>{counts[c.sub.planId]=(counts[c.sub.planId]||0)+1});
  const row=p=>`<button class="row${p.archived?' off':''}" data-editplan="${p.id}"><span class="l"><span class="name">${esc(p.label)}</span><span class="meta">${p.type==='visits'?'По занятиям':'По сроку'} · ${planLen(p)}${counts[p.id]?` · ${counts[p.id]} ${plural(counts[p.id],['клиент','клиента','клиентов'])}`:''}</span></span><span class="r" style="color:var(--accent)">${money(p.price)}</span></button>`;
  const act=db.plans.filter(p=>!p.archived),arc=db.plans.filter(p=>p.archived);
  showSheet(`<div class="ph"><h2>Тарифы и цены</h2><button class="x" data-close aria-label="Закрыть">×</button></div>
  <div>${act.map(row).join('')}</div>
  <button class="big" data-editplan="">+ Добавить тариф</button>
  ${arc.length?`<div><p class="sub-h">Скрытые тарифы</p><div style="margin-top:10px">${arc.map(row).join('')}</div></div>`:''}
  <p class="hint" style="text-align:left;margin:0">Новая цена действует для новых оплат. Уже купленные абонементы не меняются.</p>`);
}
function openPlanEdit(id){
  const p=id?plan(id):null;
  ui.sheet={kind:'plan',id:id||null};
  const type=p?p.type:'period',unit=p&&p.days?'day':'month';
  showSheet(`<div class="ph"><h2>${p?'Изменить тариф':'Новый тариф'}</h2><button class="x" data-plans aria-label="Назад">×</button></div>
  <div class="f"><label for="pName">Название</label><input id="pName" value="${esc(p?p.label:'')}" placeholder="Например, Студенческий" autocomplete="off"></div>
  <div class="f"><span class="lab">Как считается</span><div class="seg" id="pType"><button type="button" class="${type==='period'?'on':''}" data-ptype="period"${p?' disabled':''}>По сроку</button><button type="button" class="${type==='visits'?'on':''}" data-ptype="visits"${p?' disabled':''}>По занятиям</button></div>${p?'<span class="meta">Тип существующего тарифа менять нельзя. Создайте новый.</span>':''}</div>
  <div class="inline" id="pPeriod"${type==='period'?'':' hidden'}><div class="f"><label for="pLen">Длительность</label><input id="pLen" type="number" inputmode="numeric" min="1" value="${p&&type==='period'?(p.days||p.months):1}"></div>
    <div class="seg" id="pUnit"><button type="button" class="${unit==='month'?'on':''}" data-punit="month">мес.</button><button type="button" class="${unit==='day'?'on':''}" data-punit="day">дней</button></div></div>
  <div class="f" id="pVisits"${type==='visits'?'':' hidden'}><label for="pCount">Количество занятий</label><input id="pCount" type="number" inputmode="numeric" min="1" value="${p&&type==='visits'?p.count:12}"></div>
  <div class="f"><label for="pPrice">Цена, смн</label><input id="pPrice" type="number" inputmode="numeric" min="0" value="${p?p.price:''}" placeholder="0"></div>
  <p class="err" id="pErr" hidden></p>
  <button class="big" data-saveplan>${p?'Сохранить тариф':'Добавить тариф'}</button>
  ${p?`<div id="arcBox">${p.archived?'<button class="btn g" data-restoreplan>Вернуть тариф в выбор</button>':'<button class="btn r" data-arcplan>Скрыть тариф</button>'}</div>`:''}`);
}
function savePlan(){
  const id=ui.sheet.id,err=document.getElementById('pErr'),fail=m=>{err.textContent=m;err.hidden=false};
  const label=document.getElementById('pName').value.trim().replace(/\s+/g,' ');
  const type=(document.querySelector('#pType .on')||{}).dataset.ptype||'period';
  const unit=(document.querySelector('#pUnit .on')||{}).dataset.punit||'month';
  const len=Math.round(Number(document.getElementById('pLen').value)||0);
  const cnt=Math.round(Number(document.getElementById('pCount').value)||0);
  const priceRaw=document.getElementById('pPrice').value,price=Number(priceRaw);
  if(!label)return fail('Впишите название тарифа.');
  if(db.plans.some(x=>x.id!==id&&!x.archived&&norm(x.label)===norm(label)))return fail('Тариф с таким названием уже есть.');
  if(type==='period'&&(len<1||len>(unit==='day'?366:36)))return fail(unit==='day'?'Длительность: от 1 до 366 дней.':'Длительность: от 1 до 36 месяцев.');
  if(type==='visits'&&(cnt<1||cnt>500))return fail('Количество занятий: от 1 до 500.');
  if(priceRaw===''||!(price>=0))return fail('Укажите цену.');
  const data={label,type,price:Math.round(price)};
  if(type==='period'){if(unit==='day'){data.days=len}else{data.months=len}}else data.count=cnt;
  if(id){const p=db.plans.find(x=>x.id===id);delete p.days;delete p.months;delete p.count;Object.assign(p,data)}
  else db.plans.push({id:'p'+newId(),...data});
  save();render();openPlans();toast(id?'Тариф сохранён':'Тариф добавлен');
}

function showSheet(html){
  document.getElementById('sheet').innerHTML=`<div class="overlay" data-backdrop><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow='hidden';
}
function closeSheet(){ui.sheet=null;document.getElementById('sheet').innerHTML='';document.body.style.overflow=''}

function selectedPlan(){const on=document.querySelector('#planChips .chip.on');return on?on.dataset.plan:pickPlan('m1')}
function paidSelected(){const on=document.querySelector('#paySeg .on');return !on||on.dataset.pay==='1'}

function saveNew(){
  const name=document.getElementById('nName').value.trim().replace(/\s+/g,' ');
  const phone=document.getElementById('nPhone').value.replace(/\D/g,'').replace(/^992/,'');
  const start=document.getElementById('nStart').value||TODAY;
  const sum=Math.max(0,Number(document.getElementById('nSum').value)||0);
  const err=document.getElementById('nErr');
  if(!name){err.textContent='Впишите имя клиента.';err.hidden=false;return}
  if(phone&&live().some(c=>c.phone===phone)){err.textContent='Клиент с таким телефоном уже есть. Найдите его через поиск.';err.hidden=false;return}
  const pid=selectedPlan(),paid=paidSelected();
  const c={id:newId(),name,phone,sub:makeSub(pid,start),debt:paid?0:sum,visits:[],created:TODAY,payments:paid&&sum?[{date:TODAY,amount:sum,planId:pid}]:[]};
  db.clients.push(c);save();closeSheet();ui.q='';document.getElementById('q').value='';ui.tab='clients';render();
  toast(`${name} добавлен`);
}
function saveRenew(){
  const c=byId(ui.sheet.id);if(!c)return;
  const pid=selectedPlan(),p=plan(pid),paid=paidSelected();
  const sum=Math.max(0,Number(document.getElementById('rSum').value)||0);
  if(p.type==='period'){
    const cur=plan(c.sub.planId);
    const start=(cur.type==='period'&&diff(c.sub.end,TODAY)>=0)?addDays(c.sub.end,1):TODAY;
    c.sub=makeSub(pid,start);
  }else{
    const cur=plan(c.sub.planId);
    const left=cur.type==='visits'?Math.max(0,c.sub.total-c.sub.used):0;
    c.sub=makeSub(pid,TODAY,left);
  }
  if(paid){if(sum)c.payments.push({date:TODAY,amount:sum,planId:pid})}else c.debt+=sum;
  save();render();openClient(c.id);toast('Абонемент продлён');
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-backdrop]');if(!t)return;
  const d=t.dataset;
  if(d.backdrop!==undefined){if(e.target===t)closeSheet();return}
  if(d.come){mark(d.come,false);return}
  if(d.force){mark(d.force,true);return}
  if(d.cancel!==undefined){ui.pending=null;render();return}
  if(d.open){openClient(d.open);return}
  if(d.new!==undefined){openNew(d.new);return}
  if(d.tab){ui.tab=d.tab;ui.pending=null;render();window.scrollTo(0,0);return}
  if(d.close!==undefined){closeSheet();return}
  if(d.plan){
    document.querySelectorAll('#planChips .chip').forEach(x=>x.classList.toggle('on',x===t));
    const s=document.getElementById('nSum')||document.getElementById('rSum');if(s)s.value=plan(d.plan).price;return}
  if(d.pay){document.querySelectorAll('#paySeg button').forEach(x=>{x.classList.toggle('on',x===t);x.classList.toggle('debt',x===t&&d.pay==='0')});return}
  if(d.savenew!==undefined){saveNew();return}
  if(d.edit){openEdit(d.edit);return}
  if(d.saveedit!==undefined){saveEdit();return}
  if(d.freeze!==undefined){const b=document.getElementById('freezeBox');b.hidden=!b.hidden;if(!b.hidden){updFreezeInfo();b.scrollIntoView({block:'nearest',behavior:'smooth'})}return}
  if(d.fzd){document.querySelectorAll('#fzDays .chip').forEach(x=>x.classList.toggle('on',x===t));document.getElementById('fzN').value=d.fzd;updFreezeInfo();return}
  if(d.savefreeze!==undefined){saveFreeze();return}
  if(d.unfreeze!==undefined){const c=byId(ui.sheet.id);const was=!!frozenNow(c);unfreeze(c);save();render();openClient(c.id);toast(was?'Абонемент разморожен':'Заморозка отменена');return}
  if(d.plans!==undefined){openPlans();return}
  if(d.editplan!==undefined){openPlanEdit(d.editplan);return}
  if(d.ptype){if(t.disabled)return;document.querySelectorAll('#pType button').forEach(x=>x.classList.toggle('on',x===t));document.getElementById('pPeriod').hidden=d.ptype!=='period';document.getElementById('pVisits').hidden=d.ptype!=='visits';return}
  if(d.punit){document.querySelectorAll('#pUnit button').forEach(x=>x.classList.toggle('on',x===t));return}
  if(d.saveplan!==undefined){savePlan();return}
  if(d.arcplan!==undefined){if(activePlans().length<=1){toast('Нужен хотя бы один тариф');return}document.getElementById('arcBox').innerHTML='<div class="confirm"><p><b>Скрыть тариф?</b> Его не будет в выборе. Клиенты с ним и история оплат останутся.</p><button class="btn r" data-arcyes>Скрыть</button><button class="btn g" data-editplan="'+ui.sheet.id+'">Нет</button></div>';return}
  if(d.arcyes!==undefined){db.plans.find(x=>x.id===ui.sheet.id).archived=true;save();render();openPlans();toast('Тариф скрыт');return}
  if(d.restoreplan!==undefined){db.plans.find(x=>x.id===ui.sheet.id).archived=false;save();render();openPlans();toast('Тариф снова в выборе');return}
  if(d.renew!==undefined){const b=document.getElementById('renewBox');b.hidden=!b.hidden;if(!b.hidden)b.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  if(d.saverenew!==undefined){saveRenew();return}
  if(d.paydebt!==undefined){const c=byId(ui.sheet.id);c.payments.push({date:TODAY,amount:c.debt,planId:c.sub.planId});c.debt=0;save();render();openClient(c.id);toast('Долг погашен');return}
  if(d.del!==undefined){document.getElementById('delBox').innerHTML=`<div class="confirm"><p><b>Удалить клиента из списка?</b> Его оплаты останутся в статистике дохода.</p><button class="btn r" data-delyes>Удалить</button><button class="btn g" data-delno>Нет</button></div>`;return}
  if(d.delno!==undefined){document.getElementById('delBox').innerHTML='<button class="btn r" data-del>Удалить клиента</button>';return}
  if(d.delyes!==undefined){const dc=byId(ui.sheet.id);if(dc)dc.deleted=true;save();closeSheet();render();toast('Клиент удалён');return}
  if(d.reset!==undefined){db=seed();save();ui.q='';document.getElementById('q').value='';render();toast('Примеры восстановлены');return}
  if(d.wipe!==undefined){db={clients:[],demo:false,plans:db.plans||copyPlans()};save();render();toast('Список пуст. Добавьте первого клиента');return}
  if(d.export!==undefined){exportData();return}
  if(d.datasheet!==undefined){openData();return}
  if(d.fscreate!==undefined){fsCreate();return}
  if(d.fsopen!==undefined){fsOpen();return}
  if(d.fsreconnect!==undefined){fsReconnect();return}
  if(d.fsoff!==undefined){fsOff();return}
  if(d.xlsx!==undefined){exportExcel(t);return}
  if(d.stmode){ui.st.mode=d.stmode;const n=new Date();if(d.stmode==='month'&&ui.st.y===n.getFullYear())ui.st.m=n.getMonth();render();return}
  if(d.stnav){ui.st=shiftPer(ui.st,Number(d.stnav));render();return}
  if(d.bar!==undefined){readBar(Number(d.bar));return}
  if(d.import!==undefined){document.getElementById('importFile').click();return}
});
document.addEventListener('input',e=>{if(e.target.id==='fzN'||e.target.id==='fzFrom'){if(e.target.id==='fzN')document.querySelectorAll('#fzDays .chip').forEach(x=>x.classList.toggle('on',x.dataset.fzd===e.target.value));updFreezeInfo()}});
document.addEventListener('mouseover',e=>{const b=e.target.closest('.bar');if(b)readBar(Number(b.dataset.bar))});
const qi=document.getElementById('q');
qi.addEventListener('input',()=>{ui.q=qi.value;ui.pending=null;render()});
document.getElementById('qClear').addEventListener('click',()=>{qi.value='';ui.q='';render();qi.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='leadergym-kopiya-'+TODAY+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  db.lastBackup=Date.now();save();render();if(ui.sheet&&ui.sheet.kind==='data')openData();
  toast('Копия сохранена в «Загрузки»');
}
const fi=document.createElement('input');fi.type='file';fi.accept='.json,application/json';fi.id='importFile';fi.hidden=true;document.body.appendChild(fi);
fi.addEventListener('change',()=>{
  const f=fi.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.clients))throw 0;if(!Array.isArray(d.plans))d.plans=copyPlans();db=d;db.demo=false;save();render();if(ui.sheet&&ui.sheet.kind==='data')closeSheet();toast('Копия загружена: '+d.clients.length+' клиентов')}catch(e){toast('Этот файл не похож на копию Leader Gym')}fi.value=''};
  r.readAsText(f);
});
load();render();fsInit();

})();
</script>
</body>
